name: MCPB

# Attach the Desktop Extension to the GitHub Release for a version tag.
# The container image and the MCP registry entry stay in publish.yml.
on:
  push:
    tags: ["v*"]

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Sigstore-signed build provenance for the .mcpb files.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the mcpb bundle
        run: bash scripts/build-mcpb.sh

      - name: Compute SHA256 checksums for the bundles
        run: bash scripts/mcpb-checksums.sh dist-mcpb dist-mcpb/checksums.txt

      - name: Attest build provenance for the bundles
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-mcpb/*.mcpb

      - name: Create the GitHub release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Desktop extension for ${GITHUB_REF_NAME}."
          fi

      - name: Upload the mcpb bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --clobber

      - name: Upload the bundle checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/checksums.txt --clobber
