name: Publish

# Pushes the container image to GHCR and publishes server.json to the official
# MCP registry (registry.modelcontextprotocol.io). Nothing here runs on a plain
# push: it runs by hand for the version already in package.json, or on a v* tag.
# Both GHCR (GITHUB_TOKEN) and the registry (a short-lived GitHub OIDC token)
# authenticate as this workflow, so no personal login or stored secret exists.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/stufently/google-webtools-mcp
  PUBLISHER_VERSION: "1.8.1"
  PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # One version, four places: package.json, server.json, the image tag the
      # registry entry points at and the tag README.md tells users to run. A
      # mismatch would publish an entry for an image that does not exist.
      - name: Check versions agree
        id: ver
        run: |
          node scripts/sync-version.mjs --check
          version=$(jq -r .version package.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 too: most Claude Desktop and Cursor users are on Apple silicon.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest

      # The registry reads the image anonymously and rejects it unless the
      # label names this server. Fail here, with the reason, rather than there.
      - name: Check image is public and labelled
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker logout ghcr.io
          docker pull -q "${IMAGE}:${VERSION}" || { echo "anonymous pull failed: make the GHCR package public (package settings -> visibility)"; exit 1; }
          label=$(docker inspect "${IMAGE}:${VERSION}" --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')
          [ "$label" = "$(jq -r .name server.json)" ] || { echo "image label '$label' does not match server.json name"; exit 1; }

      - name: Install mcp-publisher
        run: |
          url="https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o publisher.tar.gz "$url"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
