name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lines that are not past EOL. 22 is the floor the project
        # promises (`engines` >=22, tsup targets node22); 24 is the LTS the
        # image runs (node:24-slim); 26 is Current, tested so the next LTS
        # does not arrive as a surprise. Drop a line when it reaches EOL and
        # raise `engines` and the tsup target with it.
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here pushes, and the npm scripts below run PR-authored code.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # package.json is the version; server.json and the image tag pinned in
      # README.md must name the same one (see "Releasing" in README.md).
      - name: Versions agree
        run: npm run check:version

      # `lint` is `tsc --noEmit`, so this is the typecheck too. There is no
      # ESLint or Prettier in this project — no lint/format steps beyond it.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Container image starts and lists tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t google-webtools-mcp:ci .

      # No credentials and no network, the way a directory (Glama) introspects
      # the image: the server must still start, answer initialize and
      # tools/list, and report the missing credentials only on a tool call.
      # The container is named so a timeout cannot leave it running.
      - name: initialize + tools/list over stdio, no credentials, no network
        run: |
          name="gwt-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_properties","arguments":{}}}'
            sleep 5; } | timeout 60 docker run -i --rm --name "$name" --network none google-webtools-mcp:ci > out.jsonl
          cat out.jsonl
          jq -e 'select(.id == 1) | .result.serverInfo.name == "google-webtools-mcp"' out.jsonl
          jq -e 'select(.id == 2) | (.result.tools | length) > 0' out.jsonl
          jq -e 'select(.id == 3) | .result.isError == true and (.result.content[0].text | contains("No valid Google Search Console credentials"))' out.jsonl
