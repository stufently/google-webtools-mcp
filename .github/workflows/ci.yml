name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lines that are not past EOL. 22 is the floor the project
        # promises (`engines` >=22, tsup targets node22); 24 is the LTS the
        # image runs (node:24-slim); 26 is Current, tested so the next LTS
        # does not arrive as a surprise. Drop a line when it reaches EOL and
        # raise `engines` and the tsup target with it.
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing here pushes, and the npm scripts below run PR-authored code.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # `lint` is `tsc --noEmit`, so this is the typecheck too. There is no
      # ESLint or Prettier in this project — no lint/format steps beyond it.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Container image starts and lists tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # server.json is what the MCP registry publishes; it must point at the
      # image tag the Publish workflow will push for this package.json version.
      - name: server.json matches package.json
        run: |
          version=$(jq -r .version package.json)
          [ "$(jq -r .version server.json)" = "$version" ]
          [ "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/stufently/google-webtools-mcp:$version" ]

      - name: Build image
        run: docker build -t google-webtools-mcp:ci .

      # A syntactically complete but fake service account key: the server
      # authenticates lazily, so initialize and tools/list need no Google call.
      - name: initialize + tools/list over stdio
        run: |
          export GOOGLE_SERVICE_ACCOUNT_KEY='{"type":"service_account","project_id":"ci","private_key_id":"ci","private_key":"-----BEGIN PRIVATE KEY-----\nCI\n-----END PRIVATE KEY-----\n","client_email":"ci@ci.iam.gserviceaccount.com","client_id":"1","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5; } | timeout 60 docker run -i --rm -e GOOGLE_SERVICE_ACCOUNT_KEY google-webtools-mcp:ci > out.jsonl
          cat out.jsonl
          jq -e 'select(.id == 1) | .result.serverInfo.name == "google-webtools-mcp"' out.jsonl
          jq -e 'select(.id == 2) | (.result.tools | length) > 0' out.jsonl
